<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Login | Life Care Plus</title>

<style>
/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* BODY BACKGROUND */
body{
    background:linear-gradient(rgba(95,23,130,0.6), rgba(95,23,130,0.6)),
               url("images/reg2.jpeg");
    background-size:cover;
    background-position:center;
    min-height:100vh;

    display:flex;
    flex-direction:column;
}

/* NAVBAR */
nav{
    background:#333;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    padding:14px 18px;
    display:inline-block;
}

nav a:hover{
    background:#5f1782;
}

/* FORM CONTAINER */
.container{
    max-width:400px;
    margin: auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

/* HEADING */
h2{
    text-align:center;
    color:#5f1782;
    margin-bottom:20px;
}

/* INPUT FIELDS */
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#5f1782;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#5f1782;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#47115f;
}

/* MOBILE RESPONSIVE */
@media(max-width:600px){
    .container{
        margin:40px 15px;
    }
}
</style>
</head>
